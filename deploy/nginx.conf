# Copy to /etc/nginx/sites-available/ptsms and symlink into sites-enabled.
# Replace desk.example.com with your hostname (or the VPS IP for a first test).

upstream ptsms_app {
    server unix:/run/ptsms/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name desk.example.com;

    client_max_body_size 20M;

    root /srv/ptsms/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://ptsms_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://ptsms_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /srv/ptsms/backend/media/;
    }

    location /static/ {
        alias /srv/ptsms/backend/staticfiles/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
