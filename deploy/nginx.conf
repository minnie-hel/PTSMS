# Copy to /etc/nginx/conf.d/ptsms.conf on AlmaLinux.
# TLS files live on the VPS under /etc/letsencrypt/live/paultoursafari.space/

upstream ptsms_app {
    server unix:/run/ptsms/gunicorn.sock fail_timeout=0;
}

server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name paultoursafari.space www.paultoursafari.space 50.6.206.197;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://paultoursafari.space$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.paultoursafari.space;

    ssl_certificate /etc/letsencrypt/live/paultoursafari.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paultoursafari.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    return 301 https://paultoursafari.space$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paultoursafari.space;

    ssl_certificate /etc/letsencrypt/live/paultoursafari.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paultoursafari.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 20M;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    root /srv/ptsms/frontend/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /admin/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://ptsms_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /media/ {
        alias /srv/ptsms/backend/media/;
    }

    location /static/ {
        alias /srv/ptsms/backend/staticfiles/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
